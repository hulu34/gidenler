      - if: always()
        run: test -d out/canli && tar -C out -czf out/canli.tgz canli && rm -rf out/canli && openssl cms -encrypt -aes256 -binary -in out/canli.tgz -out out/canli.tgz.cms -outform DER ops/olcum.pem && rm out/canli.tgz
      - if: always()
