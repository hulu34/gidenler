# Ölçüm ve Google pilotu — farklı ağdan (GitHub), Vercel korumasını kaldırmadan (Protection Bypass for Automation).
# Depo herkese açık: log yalnız sayı; ayrıntılı çıktı ops/olcum.pem ile şifrelenir (anahtar yalnız proje sahibinde).
# Tetik: ops/** dalına itme; YALNIZ commit mesajındaki etiketle seçilen iş çalışır ([olcum], [toplu:N], [onay],
# [kuyruk], [selftest], [saglik]). Etiketsiz itmede bütün işler atlanır (skipped = hata değil, bildirim gitmez).
# Adresler tek yerde (env): silinmiş dağıtıma istek gitmesin diye her iş önce adresin yaşadığını kontrol eder.
# Vercel bu dalları derlemez.
name: Olcum ve pilot
on:
  push:
    branches: ["ops/**"]
permissions:
  contents: read
concurrency:
  group: olcum
  cancel-in-progress: false
env:
  OLD_HOST: gidenler-7ba3pfswn-hulu34.vercel.app
  NEW_HOST: gidenler-etjppcktn-hulu34.vercel.app
  TEST_HOST: gidenler-94y9ylr5l-hulu34.vercel.app     # korumalı staged Production test dağıtımı (Google açık)
  PREVIEW_HOST: gidenler-rla1pc9bc-hulu34.vercel.app  # görsel Faz 1 Preview (kendi Neon dalı)
jobs:
  eszaman:
    if: contains(github.event.head_commit.message, '[eszaman]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      redis:
        image: redis:7.4
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
        with: { ref: 5240cdb04148cfd6d308d4f23ee0900a618e9ed6, fetch-depth: 0 }
      - uses: actions/checkout@v4
        with: { path: ops-src }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --ignore-scripts && npm i --no-save ioredis@5.4.1
      - run: npx tsx ops-src/ops/eszaman.ts
  olcum:
    if: contains(github.event.head_commit.message, '[olcum]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops lighthouse@12.8.2 chrome-launcher@1.2.0 puppeteer-core@23.11.1
      - run: node ops/measure.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", CHROME_PATH: /usr/bin/google-chrome }
      - if: always()
        run: test -f out/olcum.json && openssl cms -encrypt -aes256 -binary -in out/olcum.json -out out/olcum.json.cms -outform DER ops/olcum.pem && rm out/olcum.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: olcum-sifreli, path: out/olcum.json.cms, retention-days: 3, if-no-files-found: ignore }
  onay:
    if: contains(github.event.head_commit.message, '[onay]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Adres yaşıyor mu
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_BYPASS" "https://$TEST_HOST/")
          echo "test dağıtımı HTTP $code"; [ "$code" = 200 ] || { echo "::error::Test dağıtımı ($TEST_HOST) yanıt vermiyor: $code"; exit 1; }
      - run: node ops/onay.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", TOPLU_HOST: "${{ env.TEST_HOST }}" }
  kuyruk:
    if: contains(github.event.head_commit.message, '[kuyruk]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Adres yaşıyor mu
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_BYPASS" "https://$TEST_HOST/")
          echo "test dağıtımı HTTP $code"; [ "$code" = 200 ] || { echo "::error::Test dağıtımı ($TEST_HOST) yanıt vermiyor: $code"; exit 1; }
      - run: node ops/kuyruk.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", TOPLU_HOST: "${{ env.TEST_HOST }}" }
  toplu:
    if: contains(github.event.head_commit.message, '[toplu:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Adres yaşıyor mu
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_BYPASS" "https://$TEST_HOST/")
          echo "test dağıtımı HTTP $code"; [ "$code" = 200 ] || { echo "::error::Test dağıtımı ($TEST_HOST) yanıt vermiyor: $code"; exit 1; }
      - name: N
        env: { MSG: "${{ github.event.head_commit.message }}" }
        run: echo "PILOT_N=$(printf '%s' "$MSG" | sed -n 's/.*\[toplu:\([0-9]\{1,2\}\)\].*/\1/p')" >> "$GITHUB_ENV"
      - run: node ops/pilot.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", TOPLU_HOST: "${{ env.TEST_HOST }}", PILOT_SHOW: "0" }
      - if: always()
        run: test -f out/pilot.json && openssl cms -encrypt -aes256 -binary -in out/pilot.json -out out/pilot.json.cms -outform DER ops/olcum.pem && rm out/pilot.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: toplu-sifreli, path: out/pilot.json.cms, retention-days: 3, if-no-files-found: ignore }
  selftest:
    if: contains(github.event.head_commit.message, '[selftest]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Adres yaşıyor mu
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_BYPASS" "https://$TEST_HOST/")
          echo "test dağıtımı HTTP $code"; [ "$code" = 200 ] || { echo "::error::Test dağıtımı ($TEST_HOST) yanıt vermiyor: $code"; exit 1; }
      - run: node ops/selftest.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", TOPLU_HOST: "${{ env.TEST_HOST }}" }
  saglik:
    if: contains(github.event.head_commit.message, '[saglik]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Adres yaşıyor mu
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "x-vercel-protection-bypass: $VERCEL_BYPASS" "https://$TEST_HOST/")
          echo "test dağıtımı HTTP $code"; [ "$code" = 200 ] || { echo "::error::Test dağıtımı ($TEST_HOST) yanıt vermiyor: $code"; exit 1; }
      - run: node ops/saglik.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", TOPLU_HOST: "${{ env.TEST_HOST }}" }
  medya:
    if: contains(github.event.head_commit.message, '[medya]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ops/medya.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
  gorsel:
    if: contains(github.event.head_commit.message, '[gorsel]')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops puppeteer-core@23.11.1 lighthouse@12.8.2 chrome-launcher@1.2.0
      - run: node ops/gorsel.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", CHROME_PATH: /usr/bin/google-chrome }
      - if: always()
        run: test -d out/gorsel && tar -C out -czf out/gorsel.tgz gorsel && rm -rf out/gorsel && openssl cms -encrypt -aes256 -binary -in out/gorsel.tgz -out out/gorsel.tgz.cms -outform DER ops/olcum.pem && rm out/gorsel.tgz
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gorsel-sifreli, path: out/gorsel.tgz.cms, retention-days: 1, if-no-files-found: ignore }
  hiz:
    if: contains(github.event.head_commit.message, '[hiz]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops puppeteer-core@23.11.1 lighthouse@12.8.2 chrome-launcher@1.2.0
      - run: node ops/gorsel.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", CHROME_PATH: /usr/bin/google-chrome, ONLY_LH: "1" }
  canli:
    if: contains(github.event.head_commit.message, '[canli]')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ops/canli.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
  oynatma:
    if: contains(github.event.head_commit.message, '[oynatma]')
    runs-on: macos-14
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops playwright@1.49.1 && npx --prefix ops playwright install webkit
      - run: node ops/oynatma.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
      - if: always()
        run: test -d out/oynatma && tar -C out -czf out/oynatma.tgz oynatma && rm -rf out/oynatma && openssl cms -encrypt -aes256 -binary -in out/oynatma.tgz -out out/oynatma.tgz.cms -outform DER ops/olcum.pem && rm out/oynatma.tgz
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: oynatma-sifreli, path: out/oynatma.tgz.cms, retention-days: 1, if-no-files-found: ignore }
  gview:
    if: contains(github.event.head_commit.message, '[gview]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ops/gview.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
  kullanim:
    if: contains(github.event.head_commit.message, '[kullanim]')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ops/kullanim.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
  dinamik:
    if: contains(github.event.head_commit.message, '[dinamik]')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ops/dinamik.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
  dalkontrol:
    if: contains(github.event.head_commit.message, '[dalkontrol]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ops/dalkontrol.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", DEPLOYS: "gidenler-6ujmo7dhd-hulu34.vercel.app,gidenler-dg054cjj3-hulu34.vercel.app,gidenler-48ts77nfk-hulu34.vercel.app,gidenler-26kjwenny-hulu34.vercel.app,gidenler-378umehn7-hulu34.vercel.app,gidenler-7yt6j334i-hulu34.vercel.app,gidenler-4b31yw1tz-hulu34.vercel.app,gidenler-nr936qzlm-hulu34.vercel.app,gidenler-8r6juufwg-hulu34.vercel.app,gidenler-7q71pmbp3-hulu34.vercel.app,gidenler-63pt1v71o-hulu34.vercel.app,gidenler-kxf01etvx-hulu34.vercel.app,gidenler-rla1pc9bc-hulu34.vercel.app,gidenler-etjppcktn-hulu34.vercel.app,gidenler-3euvpz7id-hulu34.vercel.app,gidenler-7ba3pfswn-hulu34.vercel.app,gidenler-hbvf2hhpa-hulu34.vercel.app,gidenler-kekwtvrre-hulu34.vercel.app,gidenler-rfxljljzg-hulu34.vercel.app" }
      - if: always()
        run: test -f out/dal.json && openssl cms -encrypt -aes256 -binary -in out/dal.json -out out/dal.json.cms -outform DER ops/olcum.pem && rm out/dal.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: dal-sifreli, path: out/dal.json.cms, retention-days: 1, if-no-files-found: ignore }
