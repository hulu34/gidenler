# Ölçüm ve Google pilotu — farklı ağdan (GitHub), Vercel korumasını kaldırmadan (Protection Bypass for Automation).
# Depo herkese açık: log yalnız sayı; ayrıntılı çıktı ops/olcum.pem ile şifrelenir (anahtar yalnız proje sahibinde).
# Tetik: ops/** dalına itme; YALNIZ commit mesajındaki etiketle seçilen iş çalışır ([olcum], [toplu:N], [onay],
# [kuyruk], [selftest], [saglik], [demo], [demoprofil], [demoesik]). Etiketsiz itmede bütün işler atlanır (skipped = hata değil, bildirim gitmez).
# Adresler tek yerde (env): silinmiş dağıtıma istek gitmesin diye her iş önce adresin yaşadığını kontrol eder.
# Vercel bu dalları derlemez.
name: Olcum ve pilot
on:
  push:
    branches: ["ops/**"]
permissions:
  contents: read
concurrency:
  group: olcum
  cancel-in-progress: false
env:
  OLD_HOST: gidenler-7ba3pfswn-hulu34.vercel.app
  NEW_HOST: gidenler-etjppcktn-hulu34.vercel.app
  TEST_HOST: gidenler-dhces8uow-hulu34.vercel.app     # korumalı staged Production test dağıtımı (Google açık)
  PREVIEW_HOST: gidenler-rla1pc9bc-hulu34.vercel.app
  ADAY_HOST: gidenler-puaf01iqu-hulu34.vercel.app    # canlı sürüm (ddcd558, puan üretimi — SCORE_PUBLISH=1)
  SECKI_HOST: gidenler-bwfdibvxp-hulu34.vercel.app   # Gidenler Seçkisi Preview 11. tur, profil başlığı
  PROFIL_HOST: gidenler-2h5anwthr-hulu34.vercel.app   # restoran profili V1 test ortamı (Preview ddcd558, puan üretimi)  # görsel Faz 1 Preview (kendi Neon dalı)
jobs:
  demo:
    if: contains(github.event.head_commit.message, '[demo]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node ops/demo.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", DEMO_HOST: "demo.gidenler.com" }
  demoprofil:
    if: contains(github.event.head_commit.message, '[demoprofil]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops playwright@1.49.1 && npx --prefix ops playwright install --with-deps chrome
      - run: node ops/demo-profil.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", DEMO_HOST: "demo.gidenler.com", SLUGS: "moda-lokantasi,koz-durum,asma-teras,tarcin-lokantasi,fistik,sedef-kahvalti,ayva-firin-pizza,erguvan-lokantasi,ekin-pide,meyhane-sardunya,iskele-burger,lokanta-sardunya,meyhane-nar" }
  mobilhata:
    if: contains(github.event.head_commit.message, '[mobilhata]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops playwright@1.49.1 && npx --prefix ops playwright install --with-deps chrome
      - run: node ops/mobilhata.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", TEST_HOST: "${{ env.TEST_HOST }}", PROFIL_HOST: "${{ env.PROFIL_HOST }}" }
  canlikontrol:
    if: contains(github.event.head_commit.message, '[canlikontrol]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops playwright@1.49.1 && npx --prefix ops playwright install --with-deps chrome
      - run: node ops/canli-kontrol.mjs
      - if: always()
        run: test -d out/profil && tar -C out -czf out/profil.tgz profil && rm -rf out/profil && openssl cms -encrypt -aes256 -binary -in out/profil.tgz -out out/profil.tgz.cms -outform DER ops/olcum.pem && rm out/profil.tgz
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: canli-ekran-sifreli, path: out/profil.tgz.cms, retention-days: 1, if-no-files-found: ignore }
  canliprofil:
    if: contains(github.event.head_commit.message, '[canliprofil]')
