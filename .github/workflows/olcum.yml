# Ölçüm ve Google pilotu — farklı ağdan (GitHub), Vercel korumasını kaldırmadan (Protection Bypass for Automation).
# Depo herkese açık: log yalnız sayı; ayrıntılı çıktı ops/olcum.pem ile şifrelenir (anahtar yalnız proje sahibinde).
# Tetik: ops/** dalına itme; commit mesajında [olcum] ve/veya [pilot:N] (N ≤ 25). Vercel bu dalları derlemez.
name: Olcum ve pilot
on:
  push:
    branches: ["ops/**"]
permissions:
  contents: read
concurrency:
  group: olcum
  cancel-in-progress: false
env:
  OLD_HOST: gidenler-3euvpz7id-hulu34.vercel.app
  NEW_HOST: gidenler-etjppcktn-hulu34.vercel.app
  PILOT_HOST: gidenler-hkpfv8zjs-hulu34.vercel.app
jobs:
  olcum:
    if: contains(github.event.head_commit.message, '[olcum]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops lighthouse@12.8.2 chrome-launcher@1.2.0 puppeteer-core@23.11.1
      - run: node ops/measure.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}", CHROME_PATH: /usr/bin/google-chrome }
      - if: always()
        run: test -f out/olcum.json && openssl cms -encrypt -aes256 -binary -in out/olcum.json -out out/olcum.json.cms -outform DER ops/olcum.pem && rm out/olcum.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: olcum-sifreli, path: out/olcum.json.cms, retention-days: 3, if-no-files-found: ignore }
  pilot:
    if: contains(github.event.head_commit.message, '[pilot:')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: N
        env: { MSG: "${{ github.event.head_commit.message }}" }
        run: echo "PILOT_N=$(printf '%s' "$MSG" | sed -n 's/.*\[pilot:\([0-9]\{1,2\}\)\].*/\1/p')" >> "$GITHUB_ENV"
      - run: node ops/pilot.mjs
        env: { VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}" }
      - if: always()
        run: test -f out/pilot.json && openssl cms -encrypt -aes256 -binary -in out/pilot.json -out out/pilot.json.cms -outform DER ops/olcum.pem && rm out/pilot.json
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: pilot-sifreli, path: out/pilot.json.cms, retention-days: 3, if-no-files-found: ignore }
  gorsel:
    if: contains(github.event.head_commit.message, '[gorsel]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save --no-package-lock --prefix ops puppeteer-core@23.11.1
      - run: node ops/shot.mjs
        env:
          VERCEL_BYPASS: "${{ secrets.VERCEL_BYPASS }}"
          CHROME_PATH: /usr/bin/google-chrome
          SHOT_SLUGS: 700-gram-kadikoy,aci-biber-kucukcekmece,adab-eski-usul-meyhane-sariyer
      - if: always()
        run: test -d out/shots && tar -C out -czf out/shots.tgz shots && rm -rf out/shots && openssl cms -encrypt -aes256 -binary -in out/shots.tgz -out out/shots.tgz.cms -outform DER ops/olcum.pem && rm out/shots.tgz
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: gorsel-sifreli, path: out/shots.tgz.cms, retention-days: 1, if-no-files-found: ignore }
