name: PR39 isolated profile acceptance
on:
  push:
    branches: [inceleme/pr39-bulut-kabul-20261113]
permissions:
  contents: read
jobs:
  cloud-acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: synthetic-audit-only
          POSTGRES_DB: gidenler_pr39_audit
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgres://audit:synthetic-audit-only@127.0.0.1:5432/gidenler_pr39_audit
      DB_DRIVER: pg
      DB_ADMIN_LOCAL: '1'
      VERCEL_ENV: preview
      PRODUCTION_DB_FINGERPRINT: aaaaaaaaaaaaaaaa
      GIDENLER_TEST_ONLY: pr39-20261113
      BETTER_AUTH_SECRET: synthetic-isolated-cloud-audit-secret-only-20261113
      BETTER_AUTH_URL: http://localhost:3189
      NEXT_PUBLIC_SITE_URL: http://localhost:3189
      GOOGLE_PLACES_ENABLED: '0'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a9eb89a0f73fd68243cf87c075a6f79a9a64afd5
          path: candidate
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 2031408276fc5e4a24223a4e45fa70f656ffb604
          path: baseline
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install candidate and baseline dependencies independently
        run: |
          (cd candidate && npm ci --no-audit --no-fund) &
          (cd baseline && npm ci --no-audit --no-fund) &
          wait
          test -x candidate/node_modules/.bin/tsx
          test -x baseline/node_modules/.bin/tsx
      - name: Prepare isolated PostgreSQL baseline and protected synthetic data
        working-directory: harness
        run: ../candidate/node_modules/.bin/tsx --tsconfig ../candidate/tsconfig.json scripts/pr39-prepare.ts
      - name: Source tests, type check and production build
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          npm run typecheck 2>&1 | tee ../harness/pr39-cloud-evidence/typecheck.log
          for script in gece13-profil-test menemen-foto-test menemen-profil-test seotest fototest.mjs dbtest gpuantest katalogtest aramatest sortest panel-rezervasyon-test; do
            path="scripts/$script"
            [[ "$path" == *.mjs ]] || path="$path.ts"
            ./node_modules/.bin/tsx "$path" 2>&1 | tee "../harness/pr39-cloud-evidence/$script.log"
          done
          ./node_modules/.bin/tsx scripts/katalog/profil-dogrula.ts 2>&1 | tee ../harness/pr39-cloud-evidence/profile-validator.log
          npm run build 2>&1 | tee ../harness/pr39-cloud-evidence/build.log
          git diff --exit-code
      - name: Reproduce and disclose three existing red suites on exact Production baseline
        working-directory: harness
        run: node scripts/pr39-known-baseline.mjs
      - name: Install independent Chromium and WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/pr39-browser" --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          "$RUNNER_TEMP/pr39-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Actual HTTP profile apply, failure, repeat and rollback
        working-directory: harness
        run: |
          (cd ../candidate && npm start -- -p 3189) > pr39-server.log 2>&1 &
          ../candidate/node_modules/.bin/tsx --tsconfig ../candidate/tsconfig.json scripts/pr39-api-check.ts
      - name: Built profile mobile, desktop and WebKit acceptance
        working-directory: harness
        env:
          BROWSER_PACKAGE_JSON: ${{ runner.temp }}/pr39-browser/package.json
        run: node scripts/pr39-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr39-isolated-cloud-evidence
          path: |
            harness/pr39-cloud-evidence/
            harness/pr39-server.log
          retention-days: 14
