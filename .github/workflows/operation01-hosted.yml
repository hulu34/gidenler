name: Operation 01 approved Sor production read-only checks
on:
  push:
    branches: [inceleme/yayin-operasyonu01-kabul-20261114]
permissions:
  contents: read
concurrency:
  group: operation01-production-readonly
  cancel-in-progress: false
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 99568ec6e7385be51af2454330ef536c632b55d3
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only Production state, no database credentials and no writes
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/operation01-production.mjs
      - name: Browser tools for live Sor acceptance
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-browser" --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          "$RUNNER_TEMP/hosted-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Actual live Sor preferences and follow-ups; seven bounded requests
        env:
          HOSTED_BROWSER_PACKAGE_JSON: ${{ runner.temp }}/hosted-browser/package.json
        run: node scripts/operation01-live-sor.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation01-production-readonly
          path: operation01-production-evidence/
          retention-days: 14
