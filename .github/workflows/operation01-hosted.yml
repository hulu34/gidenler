name: Operation 01 approved security production read-only checks
on:
  push:
    branches: [inceleme/yayin-operasyonu01-kabul-20261114]
permissions:
  contents: read
concurrency:
  group: operation01-production-readonly
  cancel-in-progress: false
jobs:
  readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: a225e8c1336fecc2ca6ce1ef67e09d2bb6361481
          path: candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Read-only Production state, no database credentials and no writes
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/operation01-production.mjs
      - name: Browser tools for public read-only live acceptance
        run: |
          npm install --prefix "$RUNNER_TEMP/hosted-browser" --ignore-scripts --no-audit --no-fund @playwright/test@1.56.1
          "$RUNNER_TEMP/hosted-browser/node_modules/.bin/playwright" install --with-deps chromium webkit
      - name: Public Production pages and local draft only; all browser writes blocked
        env:
          HOSTED_BROWSER_PACKAGE_JSON: ${{ runner.temp }}/hosted-browser/package.json
        run: node scripts/operation01-live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: operation01-production-readonly
          path: operation01-production-evidence/
          retention-days: 14
