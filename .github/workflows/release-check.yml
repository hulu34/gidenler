name: Production public 792 venue browser verification
on:
  push:
    branches: [ops/paket-7-14-canli-kontrol]
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 824613eea6bb392614bd00909f8948696d7d4ba5
          path: reviewed
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Public live catalog and mobile desktop verification
        run: node live-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-721b1a1-public-site
          path: live-evidence/
