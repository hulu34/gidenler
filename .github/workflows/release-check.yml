name: Exact 824613e isolated Neon Preview QA
on:
  push:
    branches: [ops/paket-7-14-preview]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 824613eea6bb392614bd00909f8948696d7d4ba5
          path: reviewed
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Guarded isolated Preview API and mobile browser checks
        run: node preview-check.mjs
        env:
          VERCEL_BYPASS: ${{ secrets.VERCEL_BYPASS }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: isolated-neon-preview-824613e
          path: evidence/
